<form class="filters" method="get">
  <div class="field"><label class="lbl">Site</label><select name="plant" onchange="this.form.submit()"><option value="">Tous</option>{% for p in plants %}<option value="{{ p.id }}" {{ 'selected' if f.plant==p.id|string }}>{{ p.name }}</option>{% endfor %}</select></div>
  <div class="field"><label class="lbl">Ligne</label><select name="line" onchange="this.form.submit()"><option value="">Toutes</option>{% for l in lines %}<option value="{{ l.id }}" {{ 'selected' if f.line==l.id|string }}>{{ l.name }}</option>{% endfor %}</select></div>
  <div class="field"><label class="lbl">SGA</label><select name="sga" onchange="this.form.submit()"><option value="">Toutes</option>{% for s in sgas %}<option value="{{ s.id }}" {{ 'selected' if f.sga==s.id|string }}>{{ s.name }}</option>{% endfor %}</select></div>
  <div class="field"><label class="lbl">Machine</label><select name="equipment" onchange="this.form.submit()"><option value="">Toutes</option>{% for e in equipment %}<option value="{{ e.id }}" {{ 'selected' if f.equipment==e.id|string }}>{{ e.name|short }}</option>{% endfor %}</select></div>
  <div class="field"><label class="lbl">Type d'anomalie</label><select name="anomaly" onchange="this.form.submit()"><option value="">Tous</option>{% for a in ANOMALY_TYPES %}<option {{ 'selected' if f.anomaly==a }}>{{ a }}</option>{% endfor %}</select></div>
  {% if show_status %}
  <div class="field"><label class="lbl">Type</label><select name="type" onchange="this.form.submit()"><option value="">Tous</option>{% for t in TAG_TYPES %}<option value="{{ t.key }}" {{ 'selected' if f.type==t.key }}>{{ t.label }}</option>{% endfor %}</select></div>
  <div class="field"><label class="lbl">Statut</label><select name="status" onchange="this.form.submit()"><option value="">Tous</option>{% for s in STATUSES %}<option {{ 'selected' if f.status==s }}>{{ s }}</option>{% endfor %}</select></div>
  {% endif %}
  <div class="field"><label class="lbl">Recherche</label><input type="text" name="search" value="{{ f.search }}" placeholder="Code, description, organe…"></div>
  <button class="btn dark">Filtrer</button> <a class="btn grey" href="?">Réinitialiser</a>
</form>
