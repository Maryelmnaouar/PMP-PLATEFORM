{% extends "base.html" %}
{% block title %}Mon compte{% endblock %}
{% block heading %}Mon compte{% endblock %}
{% block subheading %}{{ me.name }} · {{ me.role }} · identifiant {{ me.username }}{% endblock %}
{% block content %}
<form class="card" method="post" style="max-width:520px">
  <h3>Changer mon mot de passe</h3>
  <div class="field"><label class="lbl">Mot de passe actuel</label><input type="password" name="current" required autocomplete="current-password"></div>
  <div class="field"><label class="lbl">Nouveau mot de passe (8 caractères minimum)</label><input type="password" name="new" required minlength="8" autocomplete="new-password"></div>
  <div class="field"><label class="lbl">Confirmer le nouveau mot de passe</label><input type="password" name="confirm" required minlength="8" autocomplete="new-password"></div>
  <button class="btn green">Enregistrer</button>
</form>
{% endblock %}
