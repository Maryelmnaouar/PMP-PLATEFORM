<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · AssetPilot</title><link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<meta name="theme-color" content="#17202b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AssetPilot">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<div class="login-wrap">
  <div class="login-side">
    <img class="login-side-logo" src="{{ url_for('static', filename='img/logo-ecbc.png') }}" alt="Equatorial Coca-Cola Bottling Company">
    <div class="brand" style="border:0"><div class="logo">A</div><div><b>ASSETPILOT</b><small>Maintenance Autonome</small></div></div>
    <h1>Maintenance Autonome</h1>
    <p style="color:#c9d2db;max-width:440px;line-height:1.6">TAGs, checklists préventives, tableau SGA, audits AM.</p>
  </div>
  <div class="login-box">
    <img class="login-logo" src="{{ url_for('static', filename='img/logo-ecbc.png') }}" alt="Equatorial Coca-Cola Bottling Company">
    <h2 style="margin-bottom:6px">Connexion</h2>
    <p class="muted small" style="margin-top:0">Accès réservé aux utilisateurs de la plateforme.</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}{% for c, m in msgs %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}
    <form method="post">
      <div class="field"><label class="lbl">Identifiant</label><input type="text" name="username" id="username" autofocus required></div>
      <div class="field"><label class="lbl">Mot de passe</label><input type="password" name="password" id="password" required></div>
      <button class="btn big" style="width:100%;justify-content:center">Se connecter</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
