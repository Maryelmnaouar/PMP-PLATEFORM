# Déploiement Render (Blueprint) — https://render.com/docs/blueprint-spec
# Plan payant minimum requis : la base SQLite et les photos sont stockées sur un disque persistant
# (le plan gratuit efface les fichiers à chaque redémarrage).
services:
  - type: web
    name: assetpilot-am
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
    disk:
      name: assetpilot-data
      mountPath: /var/data
      sizeGB: 1
