# Déploiement Render (Blueprint) — https://render.com/docs/blueprint-spec
# Les données sont enregistrées dans une base PostgreSQL Render (variable DATABASE_URL) :
# elles sont conservées à chaque déploiement, redémarrage ou mise en veille, sans disque.
services:
  - type: web
    name: assetpilot-am
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: assetpilot-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

databases:
  - name: assetpilot-db
    region: frankfurt
